[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "radio-atlas-tui"
version = "0.1.0"
description = "A fast, minimal terminal atlas for live radio around the world."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Radio Atlas contributors" }]
keywords = ["radio", "tui", "terminal", "textual", "radio-browser", "mpv"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "textual>=8.0,<9",
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
radio-atlas = "radio_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/emimontanari/radio-atlas-TUI"
Issues = "https://github.com/emimontanari/radio-atlas-TUI/issues"

[tool.hatch.build.targets.wheel]
packages = ["radio_atlas"]

[tool.hatch.build.targets.sdist]
include = ["radio_atlas", "README.md", "LICENSE", "pyproject.toml", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
